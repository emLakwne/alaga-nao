<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- filtro que "treme" o traço, imitando caneta na mão -->
  <defs>
    <filter id="rabisco" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#rabisco)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- nuvem: contorno + um segundo traço que não fecha certinho -->
    <path d="M112 113 C 86 114, 82 84, 107 83 C 103 58, 137 49, 151 67 C 160 37, 214 34, 222 63 C 243 49, 274 63, 263 86 C 291 88, 287 117, 259 115 C 220 117, 150 112, 112 113 Z"
          fill="#e3f0fb" fill-opacity="0.18" stroke="#f4f8fb" stroke-width="3"/>
    <path d="M118 109 C 160 111, 215 112, 255 110" stroke="#f4f8fb" stroke-width="1.5" opacity="0.6"/>
    <path d="M168 58 C 176 52, 190 51, 198 56" stroke="#f4f8fb" stroke-width="1.5" opacity="0.6"/>

    <!-- chuva: tracinhos de tamanhos e inclinações diferentes -->
    <g stroke="#90caf9" stroke-width="3">
      <path d="M128 126 l-7 20"/>
      <path d="M150 131 l-5 13"/>
      <path d="M172 124 l-8 24"/>
      <path d="M196 133 l-5 15"/>
      <path d="M219 125 l-7 21"/>
      <path d="M243 129 l-6 17"/>
      <path d="M262 124 l-4 11"/>
      <path d="M140 160 l-6 16"/>
      <path d="M186 163 l-5 12"/>
      <path d="M232 158 l-7 19"/>
      <path d="M208 182 l-4 10"/>
    </g>

    <!-- casa -->
    <!-- telhado: as linhas passam um pouco da ponta, como no rascunho -->
    <path d="M70 220 L131 166 L193 218" stroke="#f4f8fb" stroke-width="3.5"/>
    <path d="M76 214 L129 170" stroke="#f4f8fb" stroke-width="1.5" opacity="0.7"/>
    <!-- hachura do telhado -->
    <g stroke="#ffbf47" stroke-width="1.6" opacity="0.85">
      <path d="M100 205 l14 -12"/>
      <path d="M110 207 l22 -19"/>
      <path d="M124 206 l22 -18"/>
      <path d="M140 206 l17 -14"/>
      <path d="M156 207 l10 -8"/>
    </g>
    <!-- chaminé -->
    <path d="M155 186 L154 165 L168 166 L169 197" stroke="#f4f8fb" stroke-width="3"/>
    <!-- paredes, nada é perfeitamente reto -->
    <path d="M86 212 L84 294" stroke="#f4f8fb" stroke-width="3.5"/>
    <path d="M178 211 L181 294" stroke="#f4f8fb" stroke-width="3.5"/>
    <path d="M82 214 L183 211" stroke="#f4f8fb" stroke-width="2" opacity="0.5"/>
    <!-- janela com cruz -->
    <path d="M96 229 L117 228 L118 249 L95 250 Z" stroke="#f4f8fb" stroke-width="2.5" fill="#ffd77a" fill-opacity="0.9"/>
    <path d="M106 229 L107 249 M95 239 L118 238" stroke="#f4f8fb" stroke-width="1.8"/>
    <!-- porta -->
    <path d="M128 294 L127 248 C 134 243, 146 243, 152 248 L154 294" stroke="#f4f8fb" stroke-width="3"/>
    <circle cx="147" cy="272" r="1.8" fill="#f4f8fb" stroke="none"/>

    <!-- água subindo: preenchimento + duas linhas de onda irregulares -->
    <path d="M0 274 C 20 266, 34 279, 56 271 C 78 263, 92 280, 118 270 C 140 262, 160 279, 186 270 C 208 263, 226 278, 250 271 C 274 264, 294 280, 318 272 C 340 265, 366 279, 400 270 L400 320 L0 320 Z"
          fill="#64b5f6" fill-opacity="0.45" stroke="none"/>
    <path d="M-4 274 C 20 266, 34 279, 56 271 C 78 263, 92 280, 118 270 C 140 262, 160 279, 186 270 C 208 263, 226 278, 250 271 C 274 264, 294 280, 318 272 C 340 265, 366 279, 404 270"
          stroke="#e3f0fb" stroke-width="2.8"/>
    <path d="M10 292 c 14 -6, 24 4, 40 -2 M74 298 c 12 -5, 22 3, 34 -1 M196 293 c 14 -6, 26 4, 42 -2 M30 310 c 10 -4, 18 3, 28 0 M150 308 c 10 -4, 20 3, 30 -1"
          stroke="#e3f0fb" stroke-width="1.6" opacity="0.7"/>

    <!-- celular com alerta, meio inclinado -->
    <g transform="rotate(-7 305 240)">
      <path d="M266 174 C 264 166, 270 162, 278 162 L336 163 C 344 163, 348 168, 348 176 L347 304 C 347 312, 342 316, 334 316 L278 315 C 270 315, 266 311, 266 303 Z"
            fill="#0b3954" stroke="#f4f8fb" stroke-width="3.5"/>
      <path d="M276 180 L338 179 L337 294 L277 295 Z" fill="#f4f8fb" stroke="none"/>
      <path d="M296 171 L316 171" stroke="#f4f8fb" stroke-width="2"/>
      <!-- triângulo de alerta -->
      <path d="M307 192 L331 233 L283 234 Z" fill="#ffbf47" stroke="#0b3954" stroke-width="2.5"/>
      <path d="M307 204 L307.5 220" stroke="#0b3954" stroke-width="3.5"/>
      <circle cx="307.5" cy="227" r="2" fill="#0b3954" stroke="none"/>
      <!-- "texto" rabiscado da mensagem -->
      <path d="M285 248 c 8 -2, 14 2, 22 0 c 6 -2, 14 1, 22 -1" stroke="#b3261e" stroke-width="3.5"/>
      <path d="M285 261 c 6 -2, 12 2, 18 0 c 5 -1, 9 1, 14 0" stroke="#4a5560" stroke-width="2.2"/>
      <path d="M285 272 c 7 -2, 13 1, 20 0 c 4 -1, 8 1, 12 0" stroke="#4a5560" stroke-width="2.2"/>
    </g>
    <!-- tremidinhas do celular vibrando -->
    <g stroke="#ffbf47" stroke-width="2.4">
      <path d="M252 188 c -6 6, -6 14, 0 20"/>
      <path d="M243 182 c -9 9, -9 23, 0 32"/>
      <path d="M362 176 c 6 6, 6 14, 0 20"/>
      <path d="M371 170 c 9 9, 9 23, 0 32"/>
    </g>
  </g>
</svg>
